org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Workaround: the project (D:\) and Pub cache (C:\) are on different drive
# roots. Kotlin's relocatable incremental-cache path converter throws
# "this and base files have different roots" when it tries to relativize a
# C:\ path against a D:\ base, which corrupts the incremental cache and
# crashes compileDebugKotlin. Disabling Kotlin incremental compilation
# avoids the buggy code path.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

