name: mb_dental_app
description: "A dedicated mobile application for patients of Mariano and Bolasoc Dental Center."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# Asset Configuration
flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_icon.png
    - assets/images/logo_login.png
    - assets/images/transparent_icon.png
    - assets/animations/animation_splash.json

# 1. App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: '#0D9488'
  adaptive_icon_foreground: "assets/images/logo_icon.png"

# 2. Splash Screen Configuration
# No real image here on purpose: the animated Lottie splash (see
# lib/screens/splash/splash_screen.dart) is the only logo the user should
# see. This native splash is just a solid color bridging the gap before
# Flutter's first frame renders. Android 12+ always draws *some* icon in its
# mandatory system splash (defaulting to the launcher icon if none is given),
# so we hand it a fully transparent 1px icon to keep that moment blank.
flutter_native_splash:
  color: '#0D9488'
  fullscreen: true
  android_12:
    image: assets/images/transparent_icon.png
    color: '#0D9488'
    icon_background_color: '#0D9488'